<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        #main{
            padding: 0px;
            margin: 0px;
            width: 100%;
            
        }
        .boxes{
              background-image:url(https://tse3.mm.bing.net/th/id/OIP.rEIhRpdpUFeCFRA0I-OA0gHaE5?rs=1&pid=ImgDetMain&o=7&rm=3);
              width: 100%;
              height: 100px;
        }
        .box{    
            /* height: 50px; */
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap:100px;
            /* border: 2px solid white; */
        }
   
        @media(min-width:400px){
            .box{
                display: grid;
                grid-template-columns: repeat(1,1fr);
                gap:10px;
            }
            /* h1{
                font-size: 200px;
                color: black;
            } */
        }
           @media(min-width:1000px){
            .box{
                display: grid;
                grid-template-columns: repeat(2,1fr);
                gap:10px;
            }
            /* h1{
                font-size: 20px;
                color: blueviolet;
            } */
        }
    </style>
</head>
<body>
    <div id="main">
        <h1>Grids</h1>
        <div class="box">
            <div class="boxes">1</div>
            <div class="boxes">2</div>
            <div class="boxes">3</div>
            <div class="boxes">4</div>
            <div class="boxes">5</div>
            <div class="boxes">6</div>
            <div class="boxes">7</div>
            <div class="boxes">8</div>
            <div class="boxes">9</div>
            <div class="boxes">10</div>
            <div class="boxes">11</div>
        </div>
    </div>
</body>
</html>
